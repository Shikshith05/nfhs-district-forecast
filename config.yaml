# =====================================================================
# nfhs-district-forecast configuration
# Paths are relative to the repo root. Every number marked ASSUMPTION is a
# modelling assumption, not a fact from the data (see DECISIONS.md).
# =====================================================================

paths:
  nfhs45_csv: data/raw/nfhs4_5/India.csv
  nfhs6_csv: data/raw/nfhs6/all_india_nfhs6_district.csv
  geojson: data/raw/geo/Districts.geojson
  processed_dir: data/processed
  outputs_dir: outputs
  models_dir: outputs/models
  # Optional human-supplied inputs for boundary harmonisation (data/lineage/README.md).
  # Missing files are fine: only repo-supported lineage is used then.
  lineage_supplied: data/lineage/lineage_supplied.csv
  population_supplied: data/lineage/population.csv
  nfhs4_census2011_supplied: data/lineage/nfhs4_census2011_values.csv

random_seed: 2026

# ---------------------------------------------------------------------
# Cleaning
# ---------------------------------------------------------------------
cleaning:
  # India.csv (NFHS-4/5) has no missing cells: the parser wrote 'na' and
  # suppressed '*' cells as 0. Rules applied in this order (DECISIONS D08):
  #  1. a district-round whose values are >= this share zeros is "not available"
  district_zero_share_missing: 0.80
  #  2. an indicator-round that is >= this share zeros was "not measured"
  indicator_zero_share_missing: 0.95
  #  3. any other 0 is kept as a true zero only if at least this share of the
  #     indicator-round's non-zero values lie in (0, 1); otherwise -> NaN
  plausible_zero_min_share_below1: 0.01
  # Districts/states removed before matching (DECISIONS D05, D06)
  excluded_states_nfhs6:
    - "Dadra & Nagar Haveli And Daman & Diu"   # 380 rows, several districts merged under one name
  excluded_districts_nfhs45:
    - ["Jammu & Kashmir", "Data Not Available"]  # placeholder row in the source

# ---------------------------------------------------------------------
# Matching (indicators and districts)
# ---------------------------------------------------------------------
matching:
  indicator_min_score: 90        # rapidfuzz score to accept a fuzzy indicator match
  indicator_min_prefix_len: 25   # a truncated text must keep >= this many chars to prefix-match
  # Only indicators whose text matches this regex are split by sex using the
  # category column (the blood sugar / blood pressure blocks repeat the same
  # text for women and men). Category is NOT used for anything else because
  # the NFHS-6 parser carries categories over incorrectly (e.g. 'Men').
  sex_split_pattern: "blood sugar|blood pressure"
  district_min_score: 90         # rapidfuzz WRatio to accept a fuzzy district match
  # A matched district is rejected if fewer than this share of its NFHS-5 values
  # in the NFHS-6 file agree (within 0.5) with India.csv NFHS-5, computed over
  # the core indicators that pass indicators.min_audit_agreement (DECISIONS D11).
  # Catches swapped districts (Maharajganj/Mahoba) and misaligned rows in core
  # indicators (Chandigarh, Lakshadweep).
  audit_min_district_agreement: 0.95
  # Normalised state names: India.csv name -> canonical (NFHS-6) name
  state_aliases:
    "andaman and nicobar island": "andaman and nicobar islands"
  # Normalised district names, per canonical state: NFHS-6 name -> India.csv name.
  # Renames and spelling variants that fuzzy matching cannot be trusted with.
  # Each is checked by the NFHS-5 audit (district_name_map.csv, audit columns).
  district_aliases:
    "assam": {"marigaon": "morigaon"}
    "bihar": {"purbi champaran": "purba champaran"}
    "chhattisgarh": {"kondagaon": "kodagaon", "korea": "koriya"}
    "gujarat": {"panch mahals": "panchmahal"}
    "haryana": {"charkhi dadri": "dadri", "gurugram": "gurgaon", "nuh": "mewat"}
    "jammu and kashmir": {"bandipora": "bandipore", "baramulla": "baramula", "budgam": "badgam",
                          "poonch": "punch", "shopian": "shupiyan"}
    "jharkhand": {"koderma": "kodarma", "purbi singhbum": "purbi singhbhum"}
    "karnataka": {"bagalkote": "bagalkot", "ballari": "bellary", "belagavi": "belgaum",
                  "bengaluru rural": "bangalore rural", "bengaluru urban": "bangalore",
                  "chikkamagaluru": "chikmagalur", "kalaburagi": "gulbarga", "mysuru": "mysore",
                  "shivamogga": "shimoga", "tumakuru": "tumkur", "vijayapura": "bijapur"}
    "maharashtra": {"beed": "bid", "buldhana": "buldana", "gondia": "gondiya", "raigad": "raigarh"}
    "odisha": {"boudh": "baudh", "deogarh": "debagarh", "nabarangpur": "nabarangapur",
               "sonepur": "subarnapur"}
    "punjab": {"gurdaspur": "gurudaspur", "sri muktsar sahib": "muktsar"}
    "rajasthan": {"chittorgarh": "chittaurgarh", "dholpur": "dhaulpur", "jalore": "jalor"}
    "tamil nadu": {"kanchipuram": "kancheepuram", "villupuram": "viluppuram"}
    "telangana": {"kumuram bheem asifabad": "komaram bheem asifabad", "hanumakonda": "warangal urban"}
    "uttar pradesh": {"amroha": "jyotiba phule nagar", "ayodhya": "faizabad",
                      "bhadohi": "sant ravidas nagar bhadohi", "hathras": "mahamaya nagar",
                      "kasganj": "kanshiram nagar", "maharajganj": "mahrajganj"}
    "west bengal": {"cooch behar": "koch bihar", "hooghly": "hugli", "howrah": "haora",
                    "paschim bardhaman": "paschim barddhaman", "purba bardhaman": "purba barddhaman",
                    "purulia": "puruliya"}

# ---------------------------------------------------------------------
# Indicators
# ---------------------------------------------------------------------
indicators:
  # Minimum share of core districts with a non-missing value in EACH of
  # NFHS-4 and NFHS-5 for an indicator to be included. NFHS-6 coverage is
  # deliberately NOT used for selection (no-leakage rule).
  min_coverage_rounds_4_5: 0.90
  # Minimum share of districts whose NFHS-5 value agrees (within 0.5) between
  # India.csv and the NFHS-6 file's own NFHS-5 column. Lower agreement means
  # NFHS-5 was recalculated for the NFHS-6 fact sheets (or mis-parsed), so the
  # NFHS-4/5 series is not comparable with NFHS-6. Uses NFHS-5 values only.
  min_audit_agreement: 0.90
  # Core set (DECISIONS D12). `text` is matched against the NFHS-6 canonical
  # text after normalisation (exact match preferred, else unique substring).
  # se_group links to noise.sample_size below.
  core:
    - {id: water_improved,      domain: wash,               se_group: households,        text: "improved drinking-water source"}
    - {id: health_insurance,    domain: wash,               se_group: households,        text: "health insurance"}
    - {id: menstrual_hygiene,   domain: wash,               se_group: women_subgroup,    text: "hygienic methods of protection"}
    - {id: women_10yr_school,   domain: women_empowerment,  se_group: women,             text: "Women with 10 or more years of schooling"}
    - {id: child_marriage,      domain: women_empowerment,  se_group: women_subgroup,    text: "Women age 20-24 years married before age 18"}
    - {id: teen_pregnancy,      domain: women_empowerment,  se_group: women_subgroup,    text: "Women age 15-19 years who were already mothers or pregnant"}
    - {id: fp_modern,           domain: women_empowerment,  se_group: women,             text: "Any modern method"}
    - {id: unmet_need,          domain: women_empowerment,  se_group: women,             text: "Total unmet need"}
    - {id: anc_first_trimester, domain: maternal_care,      se_group: mothers,           text: "antenatal check-up in the first trimester"}
    - {id: anc_4plus,           domain: maternal_care,      se_group: mothers,           text: "at least 4 antenatal care visits"}
    - {id: ifa_100d,            domain: maternal_care,      se_group: mothers,           text: "iron folic acid for 100 days"}
    - {id: pnc_mother,          domain: maternal_care,      se_group: mothers,           text: "Mothers who received postnatal care"}
    - {id: inst_births,         domain: maternal_care,      se_group: mothers,           text: "Institutional births"}
    - {id: csection,            domain: maternal_care,      se_group: mothers,           text: "Births delivered by caesarean section"}
    - {id: full_vacc,           domain: child_health,       se_group: children_subgroup, text: "fully vaccinated based on information from either vaccination card or mother's recall"}
    - {id: mcv1,                domain: child_health,       se_group: children_subgroup, text: "first dose of measles-containing vaccine"}
    - {id: vitamin_a,           domain: child_health,       se_group: children_subgroup, text: "vitamin A dose"}
    - {id: diarrhoea,           domain: child_health,       se_group: children,          text: "Prevalence of diarrhoea in the 2 weeks"}
    - {id: early_bf,            domain: child_health,       se_group: children,          text: "breastfed within one hour of birth"}
    - {id: stunting,            domain: nutrition,          se_group: children,          text: "who are stunted"}
    - {id: wasting,             domain: nutrition,          se_group: children,          text: "who are wasted"}
    - {id: underweight,         domain: nutrition,          se_group: children,          text: "who are underweight"}
    - {id: women_thin,          domain: nutrition,          se_group: women,             text: "Women whose Body Mass Index"}
    - {id: women_overweight,    domain: nutrition,          se_group: women,             text: "Women who are overweight or obese"}
  # Cross-round matches whose wording shows a definition change. Matched on
  # the NFHS-6 canonical text (substring after normalisation). Never included.
  definition_exclusions:
    - {text: "3 doses of pentavalent vaccine", reason: "NFHS-4/5 count 'penta OR DPT'; NFHS-6 counts pentavalent only"}
    - {text: "receiving an adequate diet",     reason: "possible revision to the WHO 2021 IYCF definition (NFHS-6 footnote 11); unverified, so excluded as ambiguous"}

# ---------------------------------------------------------------------
# Boundary harmonisation (nfhs_forecast/harmonise.py; DECISIONS D27-D31)
# ---------------------------------------------------------------------
harmonise:
  enabled: true                 # false = base pipeline (547 stable districts only)
  # Lineage edges below this confidence are not used (they go to
  # outputs/crosswalk_review.csv). high > medium > low > unresolved.
  min_confidence: medium
  # Train on NFHS-5 districts whose NFHS-4/5 values share boundaries even if the
  # NFHS-5 audit could not run (boundary-flagged in NFHS-6, or absent from it).
  train_include_unaudited: true
  # Use NFHS-4 values inherited from Census-2011 parents (needs supplied files).
  train_on_inherited_nfhs4: true
  # A split with no population weights: score each NFHS-6 child against its
  # NFHS-5 parent's forecast ("inherit") or drop the component ("drop").
  split_without_weights: inherit
  # ASSUMPTION: extra variance for an inherited value, as a share of the
  # indicator's within-state between-district variance (NFHS-5 values only).
  inherit_var_share:
    remnant: 0.25               # parent kept its name and most of its territory
    child: 0.50                 # child carved out of the parent
  # ASSUMPTION: coefficient of variation of estimated population weights.
  weight_cv: 0.10
  # Aggregate only if children with a value carry at least this weight share.
  min_weight_coverage: 0.80
  # Tolerance (percentage points) for rebuilding published state values.
  state_rebuild_tolerance: 1.0

# ---------------------------------------------------------------------
# Noise model (DECISIONS D14). ALL VALUES HERE ARE ASSUMPTIONS.
# The fact sheets do not publish sample sizes. n is the ASSUMED number of
# sampled units per district in the indicator's denominator population;
# SE = 100 * sqrt(p (1 - p) / n * deff) for a percentage p.
# ---------------------------------------------------------------------
noise:
  deff: 2.0                     # ASSUMPTION: design effect
  deff_sensitivity: [1.5, 2.0, 3.0]
  sample_size:                  # ASSUMPTION: per-district n (see DECISIONS D14 for derivation)
    households: 900             # households / household population
    women: 1000                 # women age 15-49 (or currently married women)
    women_subgroup: 200         # women in a 5-10 year age band (20-24, 15-19, 15-24)
    mothers: 250                # women with a birth in the last 5 years / births
    men: 140                    # men (state module subsample)
    children: 300               # children under 5 (anthropometry, illness)
    children_subgroup: 70       # children 12-23 months (vaccination) and similar narrow cohorts
  # NFHS fact sheets bracket estimates based on 25-49 unweighted cases. For a
  # row with small_sample_flag == True, n is capped at this value (inflates SE).
  small_sample_n: 37

# ---------------------------------------------------------------------
# Models and evaluation (trained / validated on NFHS-4 -> NFHS-5 ONLY)
# ---------------------------------------------------------------------
models:
  elastic_net:
    l1_ratio: [0.1, 0.5, 0.9]
    n_alphas: 30
    inner_cv_folds: 5           # GroupKFold by state inside each training fold
    max_iter: 20000
  lightgbm:                     # deliberately small: ~550 districts
    n_estimators: 150
    learning_rate: 0.05
    num_leaves: 7
    max_depth: 3
    min_child_samples: 25
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.7
    reg_lambda: 10.0
  state_trend_damping: 1.0      # multiplier on the state mean change (1.0 = full trend)
  # ML feature sets fitted and frozen (DECISIONS D32, pre-registered). "full" is
  # the primary model; the others are ablations / the no-state-dummy variant.
  feature_sets: [full, own, cross, cross_spatial, nostate]
  # Feature sets also run on the stable-boundary subset and in seen-state CV.
  feature_sets_secondary: [full, nostate]

evaluation:
  bootstrap_reps: 1000          # state-clustered bootstrap for 95% CIs
  n_jobs: -1                    # parallel CV folds (joblib); results do not depend on it
  seen_state_folds: 10          # secondary CV, districts held out, states seen (D32)
  freeze_tag: freeze-v1         # evaluate_nfhs6.py runs only if this tag == HEAD (DECISIONS D26)
  ci_level: 0.95

# ---------------------------------------------------------------------
# Gate C analyses (scripts/gate_c_analysis.py; DECISIONS D34, pre-registered)
# ---------------------------------------------------------------------
gate_c:
  alpha: 0.10                   # 90% conformal intervals
  conformal_methods: [rtm, fh_rtm, elastic_net, lightgbm]
  primary_method: auto          # lowest pooled LOSO MSE on NFHS-4->5 among primary methods
  fdr_q: 0.10                   # Benjamini-Hochberg level for surprises
  sigma_floor_share: 0.05       # forecast-error variance floor (share of residual variance)
  naive_k_min: 10               # naive top-k comparison uses k = max(#BH surprises, this)
  weight_clip: 20               # clip covariate-shift weights to [1/20, 20]
  dev_seed: 2026                # state split for --dev

# ---------------------------------------------------------------------
# Post-run pipeline (scripts/post_run.py; DECISIONS D37). Excluded from the
# config hash: it only steers analyses AFTER the NFHS-6 evaluation (D35).
# ---------------------------------------------------------------------
post_run:
  out_dir: outputs/post_run         # real results (after Gate B)
  dryrun_dir: outputs/dryrun        # DRYRUN stand-in results (NFHS-4 -> NFHS-5 LOSO predictions)
  bootstrap_reps: 1000              # state-clustered bootstrap for CIs and paired tests
  break_bootstrap_reps: 1000        # structural-break check (exploratory)
  break_q: 0.05                     # BH level for the structural-break check
  release_dir: outputs/release

# ---------------------------------------------------------------------
# NFHS-6 spot-check against the IIPS PDFs (scripts/spot_check_nfhs6.py; D33)
# ---------------------------------------------------------------------
pdf_check:
  pdf_dir: data/raw/pdfs        # PDFs + manifest.csv (file,state,district), placed by a human
  sample_size: 200              # random district x indicator pairs
  seed: 2026                    # fixed before any PDF was seen
  tolerance: 0.05               # values agree if |CSV - PDF| <= this (percentage points)
  value_columns: [nfhs6, nfhs5] # order of the value columns in the district fact sheets

# State -> region, used as a model feature that still carries information for
# a held-out state in leave-one-state-out CV. Keys are canonical state names.
regions:
  north: [jammu and kashmir, ladakh, himachal pradesh, punjab, chandigarh, haryana, nct of delhi, uttarakhand, rajasthan]
  central: [uttar pradesh, madhya pradesh, chhattisgarh]
  east: [bihar, jharkhand, odisha, west bengal, andaman and nicobar islands]
  northeast: [assam, arunachal pradesh, manipur, meghalaya, mizoram, nagaland, sikkim, tripura]
  west: [gujarat, maharashtra, goa, dadra and nagar haveli, daman and diu, dadra and nagar haveli and daman and diu]
  south: [andhra pradesh, telangana, karnataka, kerala, tamil nadu, puducherry, lakshadweep]
